<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nguyên tiêu - Hồ Chí Minh</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #eaf4ff;
            font-family: "Times New Roman", serif;
        }

        .box {
            width: 650px;
            margin: 60px auto;
            padding: 40px;
            background-color: white;
            border: 3px solid #2196f3;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: blue;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .tacgia {
            text-align: center;
            color: #555;
            font-size: 20px;
            font-style: italic;
            margin-bottom: 30px;
        }

        .bai-tho {
            text-align: center;
            font-size: 23px;
            line-height: 2;
            color: #222;
        }

        .ten {
            text-align: right;
            margin-top: 35px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>NGUYÊN TIÊU</h1>

        <div class="tacgia">
            Chủ tịch Hồ Chí Minh
        </div>

        <div class="bai-tho">
            Kim dạ nguyên tiêu nguyệt chính viên,<br>
            Xuân giang xuân thủy tiếp xuân thiên.<br>
            Yên ba thâm xứ đàm quân sự,<br>
            Dạ bán quy lai nguyệt mãn thuyền.
        </div>

        <div class="ten">
            ĐẶNG THIÊN CÂN – STT 04
        </div>

    </div>

</body>
</html>
